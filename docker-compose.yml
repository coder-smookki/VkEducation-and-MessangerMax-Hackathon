version: "3.9" 
services:
  bot:
    container_name: Max.bot
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/migrations/versions:/src/migrations/versions
    env_file:
      - .env
    networks:
      - custom
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    container_name: Max.database
    image: postgres:15.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: MaxAdmin
      POSTGRES_PASSWORD: sgrgrgs453rfvregt34w4gw43t34tfw34t
      POSTGRES_DB: MaxDB
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U MaxAdmin -d MaxDB" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - custom

  redis:
    container_name: Max.redis
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6378:6379"  # Внутри контейнера Redis остаётся на 6379, снаружи доступен на 6378
    networks:
      - custom
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["redis-server", "--port", "6379"]

networks:
  custom:
    driver: bridge
